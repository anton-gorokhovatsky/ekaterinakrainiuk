name: Static checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check HTML and local assets
        run: python3 scripts/check_static.py
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check theme.js
      - name: Check theme behavior
        run: node --test scripts/theme.test.cjs
      - name: Check whitespace
        run: git show --format= --check HEAD
